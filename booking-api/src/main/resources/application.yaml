spring:
  application:
    name: booking-api
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booking_api_db}
    username: ${DB_USERNAME:booking}
    password: ${DB_PASSWORD:booking}
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: native   # Tomcat resolves the real client IP from X-Forwarded-For (needed for rate limiting)

app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32b}   # >= 32 chars
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  rate-limit:
    general-per-minute: 60
    auth-per-minute: 10
  admin:
    email: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:Admin12345!}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html