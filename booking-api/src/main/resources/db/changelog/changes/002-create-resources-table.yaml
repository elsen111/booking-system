databaseChangeLog:
  - changeSet:
      id: 002-create-resources-table
      author: booking-team
      changes:
        - createTable:
            tableName: resources
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(150)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_resources_name
              - column:
                  name: description
                  type: varchar(1000)
              - column:
                  name: capacity
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - sql:
            sql: ALTER TABLE resources ADD CONSTRAINT ck_resources_capacity CHECK (capacity > 0)