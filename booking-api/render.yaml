databases:
  - name: booking-db
    databaseName: booking
    user: booking
    plan: free

services:
  - type: web
    name: booking-api
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: booking-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: booking-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: booking-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: booking-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: booking-db
          property: password
      - key: JWT_SECRET
        generateValue: true          # random 256-bit value, generated once and kept
      - key: ADMIN_EMAIL
        sync: false                  # prompted for on first deploy, never stored in git
      - key: ADMIN_PASSWORD
        sync: false